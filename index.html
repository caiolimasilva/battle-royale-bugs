<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Controle - Sobrevivência</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #2c3e50; color: #ecf0f1; text-align: center; padding: 50px; }
        .card { background-color: #34495e; padding: 30px; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        input, button { padding: 10px; margin: 10px; width: 80%; border-radius: 4px; border: none; }
        button { background-color: #e74c3c; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #c0392b; }
        .area-secreta { background-color: #ffffff; color: #ffffff; padding: 10px; margin-top: 20px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Alerta: Tempestade se Aproximando</h1>
        <p>Insira o código de liberação para acessar a zona segura e garantir a Vitória Royale.</p>
        
        <input type="text" id="codigoAcesso" placeholder="Digite o código secreto">
        <button onclick="tentarFuga()">Liberar Acesso</button>

        <p id="mensagemSistema"></p>

        <div class="area-secreta">
            CHAVE_ACESSO = "MENGÃO_1895"
        </div>
    </div>

    <script>
        function tentarFuga() {
            let codigoDigitado = document.getElementById("codigoAcesso").value;
            let acessoLiberado = false; // BUG LÓGICO (FASE 3): Essa variável precisa mudar para true se o código estiver correto.

            if (codigoDigitado === "MENGÃO_1895") {
                // O desenvolvedor esqueceu de alterar a variável de acesso aqui!
                // Correção esperada: acessoLiberado = true;
            }

            if (acessoLiberado) {
                document.getElementById("mensagemSistema").innerText = "Vitória Royale! Acesso Liberado. Suba seu commit!";
                document.getElementById("mensagemSistema").style.color = "#2ecc71";
            } else {
                document.getElementById("mensagemSistema").innerText = "Falha Crítica. A Tempestade vai te alcançar.";
                document.getElementById("mensagemSistema").style.color = "#e74c3c";
            }
        }
    </script>
</body>
</html>
